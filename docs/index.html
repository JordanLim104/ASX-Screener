<!doctype html><html lang="en"><head><meta charset="utf-8"><!--STRIP-FOR-ARTIFACT-->
<title>Wounded Mid-Caps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Four skins over one data file. Each skin owns its tokens and layout.
   terminal = dense black/amber monitor · ledger = Swiss ruled list with giant numerals
   desk = card carousel fintech · heat = tile board sized by market cap            */
:root{
  --up:#1f9d55; --down:#d0312d; --warn:#c98a00;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff; --fg:#0b0b0c; --muted:#6b6b70; --line:#e3e3e6; --accent:#d0312d; --panel:#f5f5f6;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:11px;line-height:1.5;color:var(--muted);margin-top:28px}
.foot p{margin:0 0 6px}
svg{display:block;max-width:100%}

/* ---------- skin switcher (bottom) ---------- */
.switch{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.switch nav{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,20,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.switch a{font:600 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#bbb;text-decoration:none;padding:9px 12px;border-radius:999px}
.switch a[aria-current="true"]{background:#fff;color:#000}

/* ---------- detail sheet (shared, skinned by tokens) ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;background:var(--bg);color:var(--fg);overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.55)}
.sheet .in{padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0;font-size:22px}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:2px}
.sheet .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0}
.sheet .kv div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet .kv div b{font-size:17px;font-weight:600}
.sheet table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
.sheet th,.sheet td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet th{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sheet .note{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:8px;background:var(--panel);margin:8px 0}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns a,.sheet .btns button{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px;text-decoration:none}
.neg{color:var(--down)} .pos{color:var(--up)}

/* =====================================================================
   SKIN 1 · TERMINAL — deliberately single-theme (black monitor)
   ===================================================================== */
[data-skin="terminal"]{--bg:#000;--fg:#e8e6df;--muted:#8a877d;--line:#2a2a2a;--accent:#ff9f1c;--panel:#111;--amber:#ff9f1c;--up:#3ddc84;--down:#ff4d4d;--warn:#ffd23f;color-scheme:dark}
[data-skin="terminal"] body{font-family:var(--mono);font-size:12.5px}
.t-bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--amber);padding-bottom:6px}
.t-bar b{color:var(--amber);font-weight:600;letter-spacing:.04em}
.t-bar small{color:var(--muted)}
.t-cmd{color:var(--fg);margin:8px 0 2px}
.t-cmd i{font-style:normal;background:var(--amber);color:#000;padding:0 4px;margin-left:6px;font-weight:600}
.t-meta{color:var(--muted);line-height:1.6}
.t-meta em{font-style:normal;color:var(--warn)}
.t-hd{background:var(--amber);color:#000;font-weight:600;padding:3px 6px;margin-top:16px;display:flex;justify-content:space-between}
.t-tbl{width:100%;border-collapse:collapse}
.t-tbl th{color:var(--muted);font-weight:400;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px}
.t-tbl td{text-align:right;padding:7px 4px;border-bottom:1px dotted #222;white-space:nowrap}
.t-tbl th:first-child,.t-tbl td:first-child{text-align:left}
.t-tbl tr{cursor:pointer}
.t-tbl tr:active td{background:#1a1300}
.t-tk{color:var(--amber);font-weight:600}
.t-tk sup{color:var(--warn);font-size:9px;margin-left:2px}
.t-tbl .sp{width:64px}
.t-tbl .why{color:var(--muted);text-align:left;white-space:normal;font-size:11px}
.t-flags{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:14px}
.t-flags span{background:#1c1c1c;border-top:2px solid var(--amber);text-align:center;padding:6px 2px;font-size:10px;color:var(--fg)}
.t-flags span b{display:block;color:var(--amber);font-size:14px}
[data-skin="terminal"] dialog.sheet{border-radius:0;border-top:2px solid var(--amber);font-family:var(--mono)}
[data-skin="terminal"] .sheet h3{color:var(--amber)}
[data-skin="terminal"] .switch nav{background:rgba(30,30,30,.92)}
@media (max-width:420px){.t-tbl .hide-s{display:none}}

/* =====================================================================
   SKIN 2 · LEDGER — Swiss ruled list, giant numerals. Light + dark.
   ===================================================================== */
[data-skin="ledger"]{--bg:#ffffff;--fg:#0a0a0a;--muted:#707074;--line:#0a0a0a;--hair:#dcdcdf;--accent:#e4002b;--panel:#f3f3f4;--down:#e4002b;--display:"Archivo",system-ui,sans-serif}
@media (prefers-color-scheme:dark){[data-skin="ledger"]:not([data-theme="light"]){--bg:#0d0d0e;--fg:#f4f4f4;--muted:#9a9a9f;--line:#f4f4f4;--hair:#2c2c2f;--accent:#ff3b4f;--panel:#19191b;--down:#ff3b4f;color-scheme:dark}}
[data-skin="ledger"][data-theme="dark"]{--bg:#0d0d0e;--fg:#f4f4f4;--muted:#9a9a9f;--line:#f4f4f4;--hair:#2c2c2f;--accent:#ff3b4f;--panel:#19191b;--down:#ff3b4f;color-scheme:dark}
[data-skin="ledger"] body{font-family:var(--display);font-size:14px}
.l-mast{border-bottom:3px solid var(--line);padding:14px 0 10px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}
.l-mast h1{margin:0;font-size:clamp(40px,13vw,72px);line-height:.86;font-weight:900;font-stretch:72%;letter-spacing:-.02em;text-transform:uppercase}
.l-mast .d{text-align:right;font:500 11px/1.4 var(--mono);color:var(--muted)}
.l-mast .d b{display:block;color:var(--fg);font-size:28px;font-family:var(--display);font-weight:800;font-stretch:80%;line-height:1}
.l-rules{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.l-rules div{padding:8px 6px 8px 0;font:500 10.5px/1.3 var(--mono);color:var(--muted)}
.l-rules div b{display:block;font:800 15px/1.1 var(--display);font-stretch:85%;color:var(--fg)}
.l-chg{font:500 12px/1.5 var(--mono);padding:10px 0;border-bottom:1px solid var(--hair);color:var(--muted)}
.l-chg b{color:var(--fg)}
.l-sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;border-bottom:3px solid var(--line);padding-bottom:4px}
.l-sec h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.l-sec span{font:500 11px var(--mono);color:var(--muted)}
.l-row{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:14px 0 12px;border-bottom:1px solid var(--hair);width:100%;text-align:left;align-items:start}
.l-num{font-weight:900;font-stretch:66%;font-size:58px;line-height:.82;color:var(--down);letter-spacing:-.02em;min-width:2.1ch}
.l-num small{font-size:20px;font-weight:700;margin-left:1px}
.l-id{min-width:0}
.l-id .tk{font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;gap:8px;align-items:center}
.l-id .nm{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-id .mt{font:500 11.5px/1.5 var(--mono);margin-top:5px}
.l-row .sp{grid-column:1/-1;margin-top:6px}
.l-tag{font:600 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border:1px solid currentColor}
.l-tag.new{color:var(--accent)}
.l-tag.frag{color:var(--muted)}
.l-bl{display:grid;grid-template-columns:3.4em 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;align-items:baseline}
.l-bl b{font-weight:800}
.l-bl span{color:var(--muted);font-size:12.5px;min-width:0}
.l-bl i{font:500 12px var(--mono);font-style:normal}

/* =====================================================================
   SKIN 3 · DESK — card carousel, modern brokerage. Light + dark.
   ===================================================================== */
[data-skin="desk"]{--bg:#f2f4f8;--fg:#0e1726;--muted:#66728a;--line:#dfe4ee;--card:#ffffff;--accent:#2f5bff;--panel:#eef1f7;--down:#e5484d;--up:#18a058;--chip:#fde8e8;--sans:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme:dark){[data-skin="desk"]:not([data-theme="light"]){--bg:#0a0f1a;--fg:#e9eef8;--muted:#8693ab;--line:#1d2638;--card:#121a2a;--accent:#6c8cff;--panel:#172033;--down:#ff6369;--up:#3dd68c;--chip:#3a1619;color-scheme:dark}}
[data-skin="desk"][data-theme="dark"]{--bg:#0a0f1a;--fg:#e9eef8;--muted:#8693ab;--line:#1d2638;--card:#121a2a;--accent:#6c8cff;--panel:#172033;--down:#ff6369;--up:#3dd68c;--chip:#3a1619;color-scheme:dark}
[data-skin="desk"] body{font-family:var(--sans);font-size:14px}
.d-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.d-top .brand{font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center}
.d-top .brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.d-top time{font-size:12px;color:var(--muted)}
.d-hero{background:var(--card);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;border:1px solid var(--line)}
.d-hero .big{grid-column:1/-1}
.d-hero .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.d-hero .big span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.d-hero .k span{display:block;font-size:11px;color:var(--muted)}
.d-hero .k b{font-size:17px;font-weight:700}
.d-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.d-chips span{flex:none;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.d-h2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.d-h2 h2{margin:0;font-size:18px;font-weight:800}
.d-h2 span{font-size:12px;color:var(--muted)}
.d-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.d-card{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:10px}
.d-card .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-av{width:38px;height:38px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--accent)}
.d-card .tk{font-weight:800;font-size:16px}
.d-card .nm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.d-dd{font-weight:800;font-size:13px;color:var(--down);background:var(--chip);padding:5px 9px;border-radius:999px;white-space:nowrap}
.d-card .px{font-size:26px;font-weight:800;letter-spacing:-.02em}
.d-card .px small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.d-card .ft{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.d-card .ft span{display:block;color:var(--muted);font-size:11px}
.d-card .ft b{font-weight:700}
.d-list{background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.d-li{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.d-li:last-child{border-bottom:0}
.d-li .tk{font-weight:800}
.d-li .why{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-meter{width:72px;text-align:right;font-size:12px;font-weight:700}
.d-meter i{display:block;height:5px;border-radius:3px;background:var(--panel);margin-top:5px;overflow:hidden}
.d-meter i em{display:block;height:100%;background:var(--warn);border-radius:3px}
[data-skin="desk"] dialog.sheet{border-radius:24px 24px 0 0;font-family:var(--sans)}
.d-new{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

/* =====================================================================
   SKIN 4 · HEAT — tile board, sized by market cap, shaded by drawdown.
   Deliberately single-theme (dark board).
   ===================================================================== */
[data-skin="heat"]{--bg:#0c0c0d;--fg:#f2f2f2;--muted:#8d8d93;--line:#26262a;--accent:#ff5a4e;--panel:#18181b;--cond:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
[data-skin="heat"] body{font-family:var(--cond);font-size:15px}
.h-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;padding:8px 0 12px}
.h-head h1{margin:0;font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.h-head p{margin:4px 0 0;color:var(--muted);font:500 11px/1.4 var(--mono)}
.h-legend{display:flex;align-items:center;gap:6px;font:500 10px var(--mono);color:var(--muted)}
.h-legend i{width:84px;height:8px;background:linear-gradient(90deg,#5a1a17,#ff5a4e);display:block}
.h-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:84px;grid-auto-flow:dense;gap:4px}
.h-tile{position:relative;padding:8px;text-align:left;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.h-tile.w2{grid-column:span 2}
.h-tile.h2{grid-row:span 2}
.h-tile .tk{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1}
.h-tile.w2 .tk{font-size:30px}
.h-tile .dd{font-size:18px;font-weight:700;line-height:1}
.h-tile.w2.h2 .dd{font-size:34px}
.h-tile .mc{font:500 10px var(--mono);opacity:.75}
.h-tile .flag{position:absolute;top:6px;right:6px;font:600 9px var(--mono);background:rgba(0,0,0,.45);padding:2px 4px}
.h-tile .sp{position:absolute;left:0;right:0;bottom:0;opacity:.35}
.h-sec{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.h-sec span{font:500 11px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.h-grid.bl{grid-auto-rows:64px}
.h-grid.bl .h-tile{background:var(--panel);border:1px solid #3a2f12;color:var(--fg)}
.h-grid.bl .h-tile .tk{font-size:19px}
.h-grid.bl .h-tile .dd{font-size:13px;color:#f2c14e;font-weight:600}
[data-skin="heat"] dialog.sheet{font-family:var(--mono);font-size:13px;border-radius:0}
[data-skin="heat"] .sheet h3{font-family:var(--cond);font-size:30px;text-transform:uppercase}

@media (prefers-reduced-motion:no-preference){.d-card,.h-tile,.l-row{transition:transform .12s ease}.d-card:active,.h-tile:active{transform:scale(.98)}}
</style>

<div class="wrap" id="app" aria-live="polite"><p style="font-family:monospace;color:#888">Loading screen…</p></div>
<div class="switch" id="switch" hidden><nav aria-label="Dashboard style"></nav></div>
<dialog class="sheet" id="sheet"><div class="in" id="sheetBody"></div></dialog>

<script>
/* ---------------- config ---------------- */
const DEFAULT_SKIN = "terminal";     // terminal | ledger | desk | heat
const SHOW_SWITCHER = true;          // set false once you've picked a style
const SKINS = [["terminal","Terminal"],["ledger","Ledger"],["desk","Desk"],["heat","Heat"]];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = v => v == null ? "–" : v >= 1e9 ? `A$${(v/1e9).toFixed(v>=1e10?0:2)}bn` : `A$${Math.round(v/1e6)}m`;
const money = v => v == null ? "–" : (v<0?"−":"") + (Math.abs(v)>=1e9 ? `A$${(Math.abs(v)/1e9).toFixed(2)}bn` : `A$${Math.round(Math.abs(v)/1e6)}m`);
const px = v => v == null ? "–" : v < 1 ? v.toFixed(3) : v < 10 ? v.toFixed(2) : v.toFixed(2);
const pct = (v, d=1) => v == null ? "–" : `${v.toFixed(d)}%`;
const spct = (v, d=1) => v == null ? "–" : `${v>0?"+":v<0?"−":""}${Math.abs(v).toFixed(d)}%`;
const short = s => (s||"").replace(/\b(Limited|Ltd\.?|Group|Holdings|Inc\.?|Corporation|Shs Chess.*|Chess Depository.*)\b/gi,"").replace(/\s+/g," ").replace(/[ ,.]+$/,"").trim();
const syd = iso => new Date(iso).toLocaleString("en-AU",{timeZone:"Australia/Sydney",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const sydDate = iso => new Date(iso).toLocaleDateString("en-AU",{timeZone:"Australia/Sydney",day:"numeric",month:"short",year:"numeric"});
const dShort = s => s ? new Date(s+"T00:00:00Z").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"2-digit",timeZone:"UTC"}) : "–";
const fyLabel = (m, i, n) => { const y = m.fy_end ? +m.fy_end.slice(0,4) : null; return y ? `FY${String(y - (n-1-i)).slice(2)}` : `Y${i+1}`; };
const RULE = {mcap:"Mkt cap", drawdown:"Drawdown", revenue:"Revenue", ebitda:"EBITDA"};

/* Sparkline: points from TradingView performance figures, placed on a day axis. */
function spark(m, {w=120, h=34, stroke="currentColor", fill="none", high=true, lowline=false, sw=1.5}={}) {
  const L = m.ladder || []; if (L.length < 2) return "";
  const X = {"1Y":0,"6M":182,"3M":273,"1M":335,"1W":358,"Now":365};
  const vals = L.map(p=>p.p).concat(high && m.high_52w ? [m.high_52w] : []);
  const lo = Math.min(...vals), hi = Math.max(...vals), r = (hi-lo)||1, pad = 3;
  const xy = L.map(p => [ (X[p.t]/365)*(w-2*pad)+pad, h-pad-((p.p-lo)/r)*(h-2*pad) ]);
  const d = xy.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const area = fill!=="none" ? `<path d="${d}L${xy.at(-1)[0]},${h}L${xy[0][0]},${h}Z" fill="${fill}" stroke="none"/>` : "";
  const hy = m.high_52w ? h-pad-((m.high_52w-lo)/r)*(h-2*pad) : null;
  const hl = high && hy!=null ? `<line x1="0" x2="${w}" y1="${hy}" y2="${hy}" stroke="${stroke}" stroke-opacity=".35" stroke-dasharray="2 3"/>` : "";
  const end = xy.at(-1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true">${area}${hl}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${end[0]}" cy="${end[1]}" r="2.4" fill="${stroke}"/></svg>`;
}
function revBars(m, {w=90, h=28, color="currentColor"}={}) {
  const v = m.revenue_fy || []; if (!v.length) return "";
  const mx = Math.max(...v), bw = w/v.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${v.map((x,i)=>{const bh=Math.max(2,(x/mx)*(h-2));return `<rect x="${i*bw+1}" y="${h-bh}" width="${bw-3}" height="${bh}" fill="${color}" fill-opacity="${.35+.65*(i+1)/v.length}"/>`}).join("")}</svg>`;
}

/* ---------------- detail sheet ---------------- */
function openSheet(m) {
  const yoy = m.revenue_yoy_pct || [];
  const rows = (m.revenue_fy||[]).map((v,i,a)=>`<tr><td>${fyLabel(m,i,a.length)}</td><td>${money(v)}</td><td class="${i&&yoy[i-1]<=0?"neg":""}">${i?spct(yoy[i-1]):"–"}</td><td>${m.ebitda_fy_hist&&m.ebitda_fy_hist[i]!=null?money(m.ebitda_fy_hist[i]):"–"}</td></tr>`).join("");
  const notes = [];
  if (m.fragile) notes.push(`<div class="note"><b>Fragile pass.</b> The 52-week high (${dShort(m.high_52w_date)}) was set at the start of the window and will roll off within days. Against the 6-month high the drawdown is ${pct(m.drawdown_vs_6m_high_pct)}${m.drawdown_vs_6m_high_pct!=null&&m.drawdown_vs_6m_high_pct<D.criteria.drawdown_min_pct?", which would fail the drawdown rule":", which would still pass"}.</div>`);
  if (m.fails && m.fails.length) notes.push(`<div class="note"><b>Fails:</b> ${m.fails.map(f=>`${RULE[f.rule]}: ${esc(f.detail)}`).join("; ")}</div>`);
  if (m.sector==="Finance") notes.push(`<div class="note">Financial company: TradingView's standardised EBITDA can differ a lot from what the company reports. Check the results release.</div>`);
  $("#sheetBody").innerHTML = `<div class="grab"></div>
    <h3>${esc(m.ticker)} · ${esc(short(m.name))}</h3>
    <div class="sub">${esc(m.industry||m.sector||"")} · ${esc(m.status)}</div>
    <div style="margin-top:14px;color:var(--down)">${spark(m,{w:600,h:90,stroke:"currentColor",fill:"currentColor",sw:2}).replace('fill="currentColor" stroke="none"','fill="currentColor" fill-opacity=".1" stroke="none"')}</div>
    <div class="kv">
      <div><span>Last price</span><b>A$${px(m.price)}</b></div>
      <div><span>Below 52w high</span><b class="neg">${pct(m.drawdown_pct)}</b></div>
      <div><span>52w high</span><b>A$${px(m.high_52w)}</b> <small style="color:var(--muted)">${dShort(m.high_52w_date)}</small></div>
      <div><span>Market cap</span><b>${cap(m.market_cap)}</b></div>
      <div><span>EBITDA (latest FY)</span><b>${money(m.ebitda_fy)}</b></div>
      <div><span>Next results</span><b>${dShort(m.next_earnings)}</b></div>
    </div>
    <table><thead><tr><th>Fiscal yr</th><th>Revenue</th><th>YoY</th><th>EBITDA</th></tr></thead><tbody>${rows}</tbody></table>
    ${notes.join("")}
    <div class="btns"><a href="${m.tv_url}" target="_blank" rel="noopener">Open in TradingView</a><button id="closeSheet">Close</button></div>`;
  const dlg = $("#sheet"); dlg.showModal();
  $("#closeSheet").onclick = () => dlg.close();
}
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.close(); });

/* ---------------- shared bits ---------------- */
let D, BY = {};
function footer() {
  return `<div class="foot">
    <p>Data: TradingView screener, delayed / end-of-day. Revenue and EBITDA are TradingView's standardised fiscal-year figures, converted to AUD. Price path is drawn from 1W/1M/3M/6M/1Y performance points, so it is approximate.</p>
    <p>A mechanical screen across ${D.universe_count} ASX stocks in the ${cap(D.criteria.market_cap_min)}–${cap(D.criteria.market_cap_max)} band. Figures can differ from company reports. Not financial advice.</p></div>`;
}
const crit = () => D.criteria;
const loosenNote = () => D.loosened ? `No stocks passed the base rules, so this run loosened them to drawdown ≥ ${crit().drawdown_min_pct}% and EBITDA > ${money(crit().ebitda_threshold)}.` : "";
const changeText = () => { const c = D.changes||{}; if (!c.since) return "First recorded run."; const a=c.added||[], r=c.removed||[]; if(!a.length&&!r.length) return `No change since ${sydDate(c.since)}.`; return `${a.length?`In: ${a.join(", ")}.`:""} ${r.length?`Out: ${r.join(", ")}.`:""}`.trim(); };
const why = m => (m.fails||[]).map(f=>f.detail).join("; ");

/* ---------------- skin renderers ---------------- */
const R = {};

R.terminal = () => {
  const M = D.matches, B = D.borderline;
  const med = M.length ? [...M].sort((a,b)=>a.drawdown_pct-b.drawdown_pct)[Math.floor(M.length/2)].drawdown_pct : null;
  const row = m => `<tr data-t="${m.ticker}"><td class="t-tk">${m.ticker}${m.is_new?"<sup>NEW</sup>":""}${m.fragile?"<sup>F</sup>":""}</td><td>${px(m.price)}</td><td class="neg">-${m.drawdown_pct.toFixed(1)}</td><td class="hide-s">${cap(m.market_cap).replace("A$","")}</td><td>${money(m.ebitda_fy).replace("A$","")}</td><td class="sp" style="color:var(--down)">${spark(m,{w:64,h:18,high:false,sw:1.2})}</td></tr>`;
  return `<div class="t-bar"><b>WMC &lt;GO&gt;</b><small>${syd(D.run_at)} SYD</small></div>
  <div class="t-cmd">ASX WOUNDED MID-CAP SCREEN<i>EQUITY</i></div>
  <div class="t-meta">MCAP ${cap(crit().market_cap_min).replace("A$","A$ ")}–${cap(crit().market_cap_max).replace("A$","")} · ≥${crit().drawdown_min_pct}% OFF 52W HI · REV↑ EACH OF ${crit().revenue_years}Y · EBITDA&gt;${money(crit().ebitda_threshold).replace("A$","")}<br>
  ${D.loosened?`<em>! ${esc(loosenNote())}</em><br>`:""}CHG: ${esc(changeText())}</div>
  <div class="t-flags"><span><b>${M.length}</b>MATCHES</span><span><b>${D.universe_count}</b>SCREENED</span><span><b>${med!=null?med.toFixed(0)+"%":"–"}</b>MED DD</span><span><b>${B.length}</b>BORDER</span></div>
  <div class="t-hd"><span>1) MATCHES</span><span>SORT: %OFF HI ▼</span></div>
  <table class="t-tbl"><thead><tr><th>TICKER</th><th>LAST</th><th>%OFF</th><th class="hide-s">MCAP</th><th>EBITDA</th><th>1Y</th></tr></thead><tbody>${M.map(row).join("")}</tbody></table>
  <div class="t-hd"><span>2) BORDERLINE</span><span>ONE RULE MISSED</span></div>
  <table class="t-tbl"><tbody>${B.map(m=>`<tr data-t="${m.ticker}"><td class="t-tk">${m.ticker}</td><td class="neg">-${(m.drawdown_pct||0).toFixed(1)}</td><td class="why">${esc(why(m))}</td></tr>`).join("")}</tbody></table>
  ${footer()}`;
};

R.ledger = () => {
  const M = D.matches, B = D.borderline, c = crit();
  const row = m => `<button class="l-row" data-t="${m.ticker}">
      <div class="l-num">${m.drawdown_pct.toFixed(0)}<small>%</small></div>
      <div class="l-id"><div class="tk">${m.ticker}${m.is_new?'<span class="l-tag new">New</span>':""}${m.fragile?'<span class="l-tag frag">Fragile</span>':""}</div>
        <div class="nm">${esc(short(m.name))}</div>
        <div class="mt">A$${px(m.price)} ← ${px(m.high_52w)} · ${cap(m.market_cap)} · EBITDA ${money(m.ebitda_fy)}</div></div>
      <div class="sp" style="color:var(--fg)">${spark(m,{w:700,h:30,sw:1.4})}</div></button>`;
  return `<header class="l-mast"><h1>Wounded<br>mid-caps</h1><div class="d">ASX · ${sydDate(D.run_at)}<b>${M.length}</b>pass all four rules</div></header>
  <div class="l-rules"><div><b>${cap(c.market_cap_min).replace("A$","$")}–${cap(c.market_cap_max).replace("A$","$")}</b>market cap</div><div><b>≥${c.drawdown_min_pct}%</b>below 52w high</div><div><b>${c.revenue_years} of ${c.revenue_years}</b>years rev growth</div><div><b>&gt;${money(c.ebitda_threshold).replace("A$","$")}</b>EBITDA</div></div>
  <div class="l-chg">${D.loosened?`<b>${esc(loosenNote())}</b><br>`:""}<b>Changes</b> ${esc(changeText())}</div>
  <div class="l-sec"><h2>Matches</h2><span>% below 52-week high</span></div>
  ${M.map(row).join("")}
  <div class="l-sec"><h2>Borderline</h2><span>missed one rule</span></div>
  ${B.map(m=>`<button class="l-bl" data-t="${m.ticker}"><b>${m.ticker}</b><span>${esc(why(m))}</span><i>${pct(m.drawdown_pct,0)}</i></button>`).join("")}
  ${footer()}`;
};

R.desk = () => {
  const M = D.matches, B = D.borderline, c = crit();
  const avgDD = M.length ? M.reduce((s,m)=>s+m.drawdown_pct,0)/M.length : null;
  const newN = M.filter(m=>m.is_new).length;
  const card = m => `<button class="d-card" data-t="${m.ticker}">
      <div class="r1"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="d-av">${m.ticker}</div><div style="min-width:0"><div class="tk">${m.ticker} ${m.is_new?'<span class="d-new">new</span>':""}</div><div class="nm">${esc(short(m.name))}</div></div></div><span class="d-dd">−${m.drawdown_pct.toFixed(1)}%</span></div>
      <div class="px">A$${px(m.price)}<small>high ${px(m.high_52w)}</small></div>
      <div style="color:var(--down)">${spark(m,{w:260,h:56,fill:"currentColor",sw:2}).replace('fill="currentColor" stroke="none"','fill="currentColor" fill-opacity=".12" stroke="none"')}</div>
      <div class="ft"><div><span>Market cap</span><b>${cap(m.market_cap)}</b></div><div><span>EBITDA</span><b>${money(m.ebitda_fy)}</b></div>
      <div><span>Revenue, ${m.revenue_fy?m.revenue_fy.length:0} FY</span><div style="color:var(--accent)">${revBars(m,{w:90,h:24})}</div></div><div><span>Rev growth (latest)</span><b class="pos">${m.revenue_yoy_pct?spct(m.revenue_yoy_pct.at(-1),0):"–"}</b></div></div>
      ${m.fragile?'<div style="font-size:11px;color:var(--warn);font-weight:700">Fragile: 52w high rolls off soon</div>':""}</button>`;
  const li = m => { const g = Math.min(100, (m.drawdown_pct||0)/c.drawdown_min_pct*100);
    return `<button class="d-li" data-t="${m.ticker}"><div class="d-av">${m.ticker}</div><div style="min-width:0"><div class="tk">${esc(short(m.name))}</div><div class="why">${RULE[m.fails[0].rule]}: ${esc(m.fails[0].detail)}</div></div><div class="d-meter">${pct(m.drawdown_pct,0)}<i><em style="width:${g}%"></em></i></div></button>`; };
  return `<div class="d-top"><div class="brand"><i>↘</i>Wounded mid-caps</div><time>${syd(D.run_at)}</time></div>
  <section class="d-hero"><div class="big"><b>${M.length} matches</b><span>${D.loosened?esc(loosenNote()):`ASX stocks passing all four rules, out of ${D.universe_count} screened`}</span></div>
    <div class="k"><span>Avg drawdown</span><b>${pct(avgDD,0)}</b></div><div class="k"><span>New today</span><b>${newN}</b></div><div class="k"><span>Borderline</span><b>${B.length}</b></div></section>
  <div class="d-chips"><span>${cap(c.market_cap_min)}–${cap(c.market_cap_max)}</span><span>≥${c.drawdown_min_pct}% off high</span><span>Rev up ${c.revenue_years}/${c.revenue_years} yrs</span><span>EBITDA &gt; ${money(c.ebitda_threshold)}</span></div>
  <div class="d-h2"><h2>Matches</h2><span>swipe →</span></div>
  <div class="d-rail">${M.map(card).join("")}</div>
  <div class="d-h2"><h2>Watchlist</h2><span>${esc(changeText())}</span></div>
  <div class="d-list">${B.map(li).join("")}</div>
  ${footer()}`;
};

R.heat = () => {
  const M = D.matches, B = D.borderline;
  const shade = dd => { const t = Math.max(0, Math.min(1, (dd-45)/40)); const a=[90,26,23], b=[255,90,78]; return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(",")})`; };
  const size = m => m.market_cap >= 2e9 ? "w2 h2" : m.market_cap >= 1e9 ? "w2" : "";
  const tile = m => `<button class="h-tile ${size(m)}" data-t="${m.ticker}" style="background:${shade(m.drawdown_pct)}">
      ${m.is_new?'<span class="flag">NEW</span>':m.fragile?'<span class="flag">FRAGILE</span>':""}
      <div class="tk">${m.ticker}</div><div><div class="dd">−${m.drawdown_pct.toFixed(0)}%</div><div class="mc">${cap(m.market_cap)}</div></div>
      ${size(m).includes("h2")?`<div class="sp" style="color:#fff">${spark(m,{w:200,h:60,high:false,sw:2})}</div>`:""}</button>`;
  return `<div class="h-head"><div><h1>Wounded<br>mid-caps</h1><p>ASX · ${syd(D.run_at)} · ${M.length} of ${D.universe_count}</p></div><div class="h-legend">45%<i></i>85%</div></div>
  ${D.loosened?`<p style="color:#f2c14e;font:500 12px var(--mono)">${esc(loosenNote())}</p>`:""}
  <div class="h-grid">${M.map(tile).join("")}</div>
  <p style="font:500 11px/1.5 var(--mono);color:var(--muted);margin:8px 0 0">Tile size = market cap (≥A$2bn, ≥A$1bn, smaller). Colour = drawdown from 52-week high. ${esc(changeText())}</p>
  <div class="h-sec">Borderline <span>missed one rule</span></div>
  <div class="h-grid bl">${B.map(m=>`<button class="h-tile" data-t="${m.ticker}"><div class="tk">${m.ticker}</div><div class="dd">${RULE[m.fails[0].rule]} · ${pct(m.drawdown_pct,0)}</div></button>`).join("")}</div>
  ${footer()}`;
};

/* ---------------- boot ---------------- */
function skinFromHash() { const h = location.hash.slice(1); return R[h] ? h : (()=>{ try { return localStorage.getItem("skin"); } catch(e){ return null; } })() || DEFAULT_SKIN; }
function render() {
  let s = skinFromHash(); if (!R[s]) s = DEFAULT_SKIN;
  document.documentElement.dataset.skin = s;
  try { localStorage.setItem("skin", s); } catch(e) {}
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#000";
  $("#app").innerHTML = R[s]();
  $("#app").querySelectorAll("[data-t]").forEach(el => el.addEventListener("click", () => openSheet(BY[el.dataset.t])));
  if (SHOW_SWITCHER) {
    $("#switch").hidden = false;
    $("#switch nav").innerHTML = SKINS.map(([k,l]) => `<a href="#${k}" aria-current="${k===s}">${l}</a>`).join("");
  }
}
(async () => {
  try {
    D = window.__DATA__ || await (await fetch("data/latest.json", {cache:"no-cache"})).json();
  } catch (e) {
    $("#app").innerHTML = `<p style="font-family:monospace">Couldn't load data/latest.json. If you opened this file directly, serve the folder over HTTP instead.</p>`; return;
  }
  [...D.matches, ...D.borderline].forEach(m => BY[m.ticker] = m);
  render();
  addEventListener("hashchange", render);
})();
</script>
