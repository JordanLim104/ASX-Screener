name: Refresh screener data

on:
  schedule:
    # 07:30 UTC Mon–Fri = 6:30pm AEDT / 5:30pm AEST, after the ASX close and
    # once TradingView's end-of-day figures have settled.
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Run screen (one TradingView request)
        run: python tv_screen.py --config criteria.yaml --out docs/data
      - name: Commit data
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Refresh screener data $(date -u +%F)"
          git push
